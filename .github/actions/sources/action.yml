name: Released xavi SDK
description: Download and verify the xavi SDK used by every desktop and mobile adapter build.
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      working-directory: hlavi
      run: |
        python3 scripts/release_check.py pins
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        source = json.load(open('release-sources.json'))['hashlink']
        print(f"hashlink_repo={source['repository']}")
        print(f"hashlink_rev={source['revision']}")
        PY
    - shell: bash
      working-directory: hlavi
      run: |
        python3 scripts/fetch_xavi.py
        python3 scripts/release_check.py pins --sdk
outputs:
  hashlink_repository:
    description: HashLink source for the Windows import library
    value: ${{ steps.pins.outputs.hashlink_repo }}
  hashlink_revision:
    description: HashLink source revision
    value: ${{ steps.pins.outputs.hashlink_rev }}
